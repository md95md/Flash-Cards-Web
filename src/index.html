<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Card Game</title>
  <link rel="stylesheet" href="css/theme-light.css">
  <link rel="stylesheet" href="css/theme-dark.css">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.10/dist/dotlottie-wc.js" 
  type="module">
  </script>
</head>
<body>

<!-- ─── Header ───────────────────────────────────── -->
<!------------------------------------------------------->

<div class="header">
  <div class="header-brand">
  
      <img src="images/logo.png" alt="Flash Card Game Logo" class="logo">

      <h1 class="app-name">Flash Card Game</h1>
  </div>
  <div class="header-controls">
    <button class="lang-switcher" onclick="cycleLang()">
      <span id="lang-label">EN</span>
    </button>
    <button class="lang-switcher" onclick="toggleTheme()" id="theme-btn">🌙</button>
  </div>
</div>

<!-- ────── Authentication screen ──────────────────────── -->
<!------------------------------------------------------->
<div id="auth-screen"> 

  <div class="container">
    <div class="hero">
      <h1 data-i18n="hero_sub">Flash Card Game is a system that actually works</h1>
    </div>

    <div class="auth-hero">
      <h2 data-i18n="hero_title">POV: you're finally studying (for real)</h2>
      <div class="auth-features">
        <div class="auth-feature" data-i18n="feature_create">Create decks</div>
        <div class="auth-feature" data-i18n="feature_study">Study & repeat</div>
        <div class="auth-feature" data-i18n="feature_track">Track progress</div>
      </div>
    </div>

    <!-- Lottie Animation -->
    <lottie-hero></lottie-hero>



    <!-- Auth form -->
    <div class="auth-box">
      <h1 data-i18n="auth_title">Let's try it out!</h1>
        <div class="form-group">
          <label data-i18n="email">email:</label>
          <input type="email" id="authEmail" placeholder="your@email.com">
        </div>

        <div class="form-group">
          <label data-i18n="password">password:</label>
          <input type="password" id="authPassword" placeholder="passexam">
        </div>
            <p id="auth-error"></p>
          <div class="button-row">
            <button class="btn-primary" onclick="handleRegister()" data-i18n="register">Fine</button>
            <div class="or-divider" data-i18n="or">or</div>
            <button type="button" class="btn-google" onclick="handleGoogleLogin()" data-i18n="continue_google">
              Continue with Google
            </button>
          </div>
      </div> 
    </div>

    <!-- Footer -->
 <app-footer></app-footer>

</div>


<!-- ────── Sign-in screen ────────────────────────────── -->
<div id="signin-screen">

  <div class="container">

    <div class="auth-box">
            <h1 data-i18n="welcome_back">Welcome back!</h1>
      <div class="form-group">
        <label data-i18n="email">Enter a valid email</label>
        <input type="email" id="signinEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label data-i18n="password">Enter 6-digit password</label>
        <input type="password" id="signinPassword" placeholder="••••••">
      </div>
      <p id="signin-error"></p>
      <div class="button-row">
        <button class="btn-primary" onclick="handleSignIn()" data-i18n="sign_in">Sign In</button>
        <div class="or-divider" data-i18n="or">or</div>
        <button type="button" class="btn-google" onclick="handleGoogleLogin()" data-i18n="continue_google">Continue with Google</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <app-footer></app-footer>

</div>

<!-- ────── App ───────────────────────────────────────── -->
<!------------------------------------------------------->
<div id="app">
<div class="container">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="decks" data-i18n="my_decks" onclick="switchTab('decks')">Decks</button>
      <button class="tab-btn" data-tab="study" data-i18n="study" onclick="switchTab('study')">Study</button>
      <button class="tab-btn" data-tab="stats" data-i18n="stats" onclick="switchTab('stats')">Statistics</button>
      <button class="tab-btn" data-tab="account" data-i18n="account" onclick="switchTab('account')">Account</button>
    </div>

    <!-- ─── Decks tab ─────────────────────────────── -->
    <div id="decks" class="content active">

      <div class="section-header">
        <h2 data-i18n="your_decks">Your Decks</h2>
        <button class="btn-primary" data-i18n="add_deck" onclick="showCreateDeckForm()">+ New Deck</button>
      </div>

      <!-- Import preview dialog -->
      <div id="import-preview-dialog" class="dialog-overlay">
        <div class="dialog-box dialog-box--wide">
          <p id="import-preview-title" class="dialog-text"></p>
          <div id="import-preview-list" class="import-preview-list"></div>
          <div class="button-row">
            <button class="btn-danger"onclick="cancelImport()" data-i18n="cancel">Cancel</button>
            <button class="btn-primary" id="import-confirm-btn" onclick="confirmImport()"></button>
          </div>
        </div>
      </div>

      <!-- Export preview dialog -->
      <div id="export-preview-dialog" class="dialog-overlay">
        <div class="dialog-box dialog-box--wide">
          <p id="export-preview-title" class="dialog-text"></p>
          <div id="export-preview-list" class="import-preview-list"></div>
          <div class="button-row">
            <button class="btn-danger" onclick="cancelExport()" data-i18n="cancel">Cancel</button>
            <button class="btn-primary" id="export-confirm-btn" onclick="confirmExport()"></button>
          </div>
        </div>
      </div>

      <!-- Confirm delete dialog -->
      <div id="confirm-dialog" class="dialog-overlay">
        <div class="dialog-box">
          <p id="confirm-text" data-i18n="delete_confirm" class="dialog-text">Delete forever?</p>
          <div class="button-row">
            <button class="btn-danger" data-i18n="cancel" onclick="confirmNo()">Cancel</button>
            <button class="btn-secondary" data-i18n="confirm" onclick="confirmYes()">Confirm</button>
          </div>
        </div>
      </div>

      <!-- Deck grid — filled by JS -->
      <div id="decks-list" class="decks-grid"></div>

      <!-- Create deck form -->
      <div id="create-deck-form" class="panel">
        <h3 data-i18n="create_deck">Create New Deck</h3>
        <div class="form-group">
          <label data-i18n="deck_name">Deck name</label>
          <input type="text" id="deckNameInput">
        </div>
        <div class="form-group">
          <label data-i18n="deck_desc">Description (optional)</label>
          <textarea id="deckDescInput"></textarea>
        </div>
        <div class="button-row">
          <button class="btn-danger" data-i18n="cancel" onclick="hideDeckForm()">Cancel</button>
          <button class="btn-primary" data-i18n="create" onclick="createDeck()">Create</button>
        </div>
      </div>
      
      <!-- Hidden file input for JSON import -->
      <input type="file" id="json-import-input" accept=".json" onchange="importJSON(event)">

      <!-- Card management panel -->
      <div id="manage-cards-panel" class="panel">
        <div class="section-header">
          <h3 data-i18n="manage_cards">Manage Cards</h3>
        </div>
        <div id="deck-controls">
          <div id="card-toolbar" class="button-row"></div>
          <div id="add-card-form" class="panel-inner">
            <h4 id="card-form-title"></h4>
            <div class="form-group">
              <label data-i18n="question">Question</label>
              <textarea id="questionInput"></textarea>
            </div>
            <div class="form-group">
              <label data-i18n="answer">Answer</label>
              <textarea id="answerInput"></textarea>
            </div>
            <div class="button-row">
              <button class="btn-danger" data-i18n="cancel" onclick="hideAddCardForm()">Cancel</button>
              <button class="btn-primary" id="card-form-submit" data-i18n="add">Add</button>
            </div>
          </div>
          <div id="cards-list"></div>
        </div>
        <div id="no-deck-selected" class="empty-state">
          <p data-i18n="select_deck">Select a deck to add or edit cards</p>
        </div>
      </div>
    </div>

    <!-- ─── Study tab ─────────────────────────────── -->
    <div id="study" class="content">
      <div id="study-content">

      </div>
    </div>

    <!-- ─── Stats tab ─────────────────────────────── -->
    <div id="stats" class="content">
      <div id="stats-content"></div>
    </div>

    <!-- ─── Account tab ───────────────────────────── -->
    <div id="account" class="content">
    <div id="account-content"></div>
    </div>

  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
