<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .page-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .page-404 h1 {
      font-size: 80px;
      font-weight: 500;
      color: #9D87ED;
      margin: 0;
      line-height: 1;
    }

    .page-404 h2 {
      font-size: 22px;
      font-weight: 500;
      margin: 1rem 0 0.5rem;
    }

    .page-404 p {
      color: #555770;
      font-size: 14px;
      max-width: 360px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="page-404">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist. Check the URL or go back to the app.</p>
    <a href="/"><button class="btn-primary">← Back to Flash Card Game</button></a>
  </div>
</body>
</html>
