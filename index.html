<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Card Game</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container">

  <div class="header">
    <h1>Flash Card Game</h1>
    <button class="lang-switcher" onclick="cycleLang()">
      <span id="lang-label">EN</span>
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn" data-tab="decks" data-i18n="my_decks" onclick="switchTab('decks')">My Decks</button>
    <button class="tab-btn active" data-tab="study" data-i18n="study" onclick="switchTab('study')">Study</button>
    <button class="tab-btn" data-tab="stats" data-i18n="stats" onclick="switchTab('stats')">Statistics</button>
  </div>

  <!-- Decks tab -->
  <div id="decks" class="content">

    <div class="section-header">
      <h2 data-i18n="your_decks">Your Decks</h2>
      <button class="btn-primary" data-i18n="add_deck" onclick="showCreateDeckForm()">+ New Deck</button>
    </div>

    <!-- Confirm delete dialog -->
    <div id="confirm-dialog" class="dialog-overlay">
      <div class="dialog-box">
        <p id="confirm-text" data-i18n="delete_confirm" class="dialog-text">Delete deck forever?</p>
        <div class="button-row">
          <button data-i18n="cancel" onclick="confirmNo()">Cancel</button>
          <button class="btn-danger" data-i18n="confirm" onclick="confirmYes()">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Create deck form -->
    <div id="create-deck-form" class="panel" style="display: none;">
      <h3 data-i18n="create_deck">Create New Deck</h3>
      <div class="form-group">
        <label data-i18n="deck_name">Deck name</label>
        <input type="text" id="deckNameInput">
      </div>
      <div class="form-group">
        <label data-i18n="deck_desc">Description (optional)</label>
        <textarea id="deckDescInput"></textarea>
      </div>
      <div class="button-row">
        <button data-i18n="cancel" onclick="hideDeckForm()">Cancel</button>
        <button class="btn-primary" data-i18n="create" onclick="createDeck()">Create</button>
      </div>
    </div>

    <!-- Deck grid filled by JS -->
    <div id="decks-list" class="decks-grid"></div>

    <!-- Card management panel -->
    <div class="panel" style="margin-top: 2rem;">

      <div class="section-header">
        <h3 data-i18n="manage_cards">Manage Cards</h3>
        <button class="btn-danger" id="delete-deck-btn" data-i18n="delete_deck" onclick="deleteDeck()" style="display: none;">Delete Deck</button>
      </div>

      <div id="deck-controls" style="display: none;">

        <div id="card-toolbar" class="button-row" style="margin-bottom: 1rem;"></div>

        <div id="add-card-form" class="panel-inner" style="display: none;">
          <h4 id="card-form-title" data-i18n="add_card">+ Add Card</h4>
          <div class="form-group">
            <label data-i18n="question">Question</label>
            <textarea id="questionInput"></textarea>
          </div>
          <div class="form-group">
            <label data-i18n="answer">Answer</label>
            <textarea id="answerInput"></textarea>
          </div>
          <div class="button-row">
            <button data-i18n="cancel" onclick="hideAddCardForm()">Cancel</button>
            <button class="btn-primary" id="card-form-submit" data-i18n="add">Add</button>
          </div>
        </div>

        <div id="cards-list"></div>

      </div>

      <div id="no-deck-selected" class="empty-state">
        <p data-i18n="select_deck">Select a deck to add or edit cards</p>
      </div>

    </div>
  </div>

  <!-- Study tab -->
  <div id="study" class="content active">
    <div id="study-content"></div>
  </div>

  <!-- Stats tab -->
  <div id="stats" class="content">
    <div id="stats-content"></div>
  </div>

</div>

<script type="module" src="index.js"></script>
</body>
</html>
