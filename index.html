<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Flash Card Game</h1>
  </div>
  
  <div class="tabs">
    <button class="tab-btn" onclick="switchTab('decks')">Мои колоды</button>
    <button class="tab-btn active" onclick="switchTab('study')">Учёба</button>
    <button class="tab-btn" onclick="switchTab('stats')">Статистика</button>
  </div>
  
  <div id="decks" class="content">
    <div class="section-header">
      <h2>Ваши колоды</h2>
      <button class="btn-primary" onclick="showCreateDeckForm()">+ Новая колода</button>
    </div>
    
    <div id="create-deck-form" class="panel" style="display: none;">
      <h3>Создать новую колоду</h3>
      <div class="form-group">
        <label>Название колоды</label>
        <input type="text" id="deckNameInput" placeholder="Например: Английский язык">
      </div>
      <div class="form-group">
        <label>Описание (опционально)</label>
        <textarea id="deckDescInput" placeholder="Описание"></textarea>
      </div>
      <div class="button-row">
        <button onclick="hideDeckForm()">Отмена</button>
        <button class="btn-primary" onclick="createDeck()">Создать</button>
      </div>
    </div>
    
    <div id="decks-list" class="decks-grid"></div>
    
    <div class="panel" style="margin-top: 2rem;">
      <div class="section-header">
        <h3 style="margin-bottom: 0;">Управление карточками</h3>
        <button class="btn-danger" onclick="deleteDeck()" id="delete-deck-btn" style="display: none;">Удалить колоду</button>
      </div>
      <div id="deck-controls" style="display: none;">
        <div id="card-toolbar" class="button-row" style="margin-bottom: 1rem;">
          <button onclick="showAddCardForm()">+ Добавить карточку</button>
        </div>
        <div id="add-card-form" class="panel-inner" style="display: none;">
          <h4 id="card-form-title" style="margin-bottom: 0.75rem;">Добавить карточку</h4>
          <div class="form-group">
            <label>Вопрос</label>
            <textarea id="questionInput" placeholder="Введите вопрос"></textarea>
          </div>
          <div class="form-group">
            <label>Ответ</label>
            <textarea id="answerInput" placeholder="Введите ответ"></textarea>
          </div>
          <div class="button-row">
            <button onclick="hideAddCardForm()">Отмена</button>
            <button class="btn-primary" id="card-form-submit" onclick="addCard()">Добавить</button>
          </div>
        </div>
        <div id="cards-list"></div>
      </div>
      <div id="no-deck-selected" class="empty-state">
        <p>Выберите колоду, чтобы добавить или отредактировать карточки</p>
      </div>
    </div>
  </div>
  
  <div id="study" class="content active">
    <div id="study-content"></div>
  </div>
  
  <div id="stats" class="content">
    <div id="stats-content"></div>
  </div>
</div>

<script src="index.js"></script>

</body>
</html>
