<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Card Game</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container">

  <div class="header">
    <h1>Flash Card Game</h1>
  </div>

  <!-- ─── Tabs ─────────────────────────────────── -->
  <div class="tabs">
    <button class="tab-btn" data-tab="decks" onclick="switchTab('decks')">Мои колоды</button>
    <button class="tab-btn active" data-tab="study" onclick="switchTab('study')">Учёба</button>
    <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">Статистика</button>
  </div>

  <!-- ─── Decks tab ─────────────────────────────── -->
  <div id="decks" class="content">

    <div class="section-header">
      <button class="btn-primary" onclick="showCreateDeckForm()">&#43 &#xa0 Добавить колоду</button>
    </div>

    <!----- -->
<div id="confirm-dialog" class="dialog-overlay">
  <div class="dialog-box">
    <p id="confirm-text" class="dialog-text">Удалить колоду навсегда?</p>
    <div class="button-row">
      <button onclick="confirmNo()">Отмена</button>
      <button class="btn-danger" onclick="confirmYes()">Подтверждаю</button>
    </div>
  </div>
</div>

    <!-- Create deck form -->
    <div id="create-deck-form" class="panel" style="display: none;">
      <h3>Создать новую колоду</h3>
      <div class="form-group">
        <label>Название колоды</label>
        <input type="text" id="deckNameInput" placeholder="Например: Английский язык">
      </div>
      <div class="form-group">
        <label>Описание (опционально)</label>
        <textarea id="deckDescInput" placeholder="Описание"></textarea>
      </div>
      <div class="button-row">
        <button onclick="hideDeckForm()">Отмена</button>
        <button class="btn-primary" onclick="createDeck()">Создать</button>
      </div>
    </div>

    <!-- Deck cards grid — filled by JS -->
    <div id="decks-list" class="decks-grid"></div>

    <!-- Card management panel -->
    <div class="panel" style="margin-top: 2rem;">

      <div class="section-header">
        <h3 style=".dialog-text">Управление карточками</h3>
        <button class="btn-danger" id="delete-deck-btn" onclick="deleteDeck()" style="display: none;">
          Удалить колоду
        </button>
      </div>

      <!-- Shown when a deck is selected -->
      <div id="deck-controls" style="display: none;">

        <!-- Add / Edit / Delete card buttons — filled by JS -->
        <div id="card-toolbar" class="button-row" style="margin-bottom: 1rem;"></div>

        <!-- Add / Edit card form -->
        <div id="add-card-form" class="panel-inner" style="display: none;">
          <h4 id="card-form-title"> + Добавить карточку</h4>
          <div class="form-group">
            <label>Вопрос</label>
            <textarea id="questionInput" placeholder="Введите вопрос"></textarea>
          </div>
          <div class="form-group">
            <label>Ответ</label>
            <textarea id="answerInput" placeholder="Введите ответ"></textarea>
          </div>
          <div class="button-row">
            <button onclick="hideAddCardForm()">Отмена</button>
            <button class="btn-primary" id="card-form-submit">Добавить</button>
          </div>
        </div>

        <!-- Cards list — filled by JS -->
        <div id="cards-list"></div>

      </div>

      <!-- Shown when no deck is selected -->
      <div id="no-deck-selected" class="empty-state">
        <p>Выберите колоду, чтобы добавить или отредактировать карточки</p>
      </div>

    </div>
  </div>

  <!-- ─── Study tab ─────────────────────────────── -->
  <div id="study" class="content active">
    <div id="study-content"></div>
  </div>

  <!-- ─── Stats tab ─────────────────────────────── -->
  <div id="stats" class="content">
    <div id="stats-content"></div>
  </div>

</div>

<script type="module" src="index.js"></script>
</body>
</html>
